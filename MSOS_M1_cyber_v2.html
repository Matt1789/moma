<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cellule de crise – CH de Montclair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F6; --sheet:#FFFFFF; --ink:#16233A; --muted:#55627A; --rule:#C9D3DF;
  --ballpoint:#1F3A93; --alarm:#C8102E; --plus:#1E7A3C; --minus:#B3261E; --amber:#9A5B00;
  --bar-bg:#DDE4EC; --focus:#1F3A93; --shadow:0 1px 0 rgba(22,35,58,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1724; --sheet:#172235; --ink:#E7EDF5; --muted:#A3B0C4; --rule:#2B3A52;
    --ballpoint:#8FB0FF; --alarm:#FF6B7D; --plus:#6FD08C; --minus:#FF8A80; --amber:#F2B45A;
    --bar-bg:#24324A; --focus:#8FB0FF; --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1724; --sheet:#172235; --ink:#E7EDF5; --muted:#A3B0C4; --rule:#2B3A52;
  --ballpoint:#8FB0FF; --alarm:#FF6B7D; --plus:#6FD08C; --minus:#FF8A80; --amber:#F2B45A;
  --bar-bg:#24324A; --focus:#8FB0FF; --shadow:none; color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:16px 20px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.brand{font-weight:800;font-size:1.05rem;letter-spacing:.01em}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.clock{font-weight:700;color:var(--alarm);font-size:1.05rem}
.meta{color:var(--muted);font-size:.9rem}
h1{font-size:2rem;line-height:1.15;margin:.2em 0 .3em;font-weight:800}
h2{font-size:1.3rem;margin:1.2em 0 .5em;font-weight:700}
h3{font-size:1.05rem;margin:.8em 0 .3em}
p{margin:.4em 0 .8em;max-width:75ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;box-shadow:var(--shadow)}
.sheet + .sheet{margin-top:16px}
.situation{border-left:6px solid var(--alarm)}
.situation .when{font-weight:700;color:var(--alarm)}
.variant{background:color-mix(in srgb,var(--alarm) 8%,transparent);border-radius:4px;padding:8px 12px;margin-top:8px}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
@media (max-width:600px){.roles{grid-template-columns:1fr}}
.role{border:1px dashed var(--rule);border-radius:6px;padding:10px 12px;background:transparent;text-align:left;cursor:pointer;width:100%}
.role > b{display:block}
.role .hint{color:var(--muted);font-size:.9rem}
.role[aria-expanded="true"]{border-style:solid;border-color:var(--ballpoint)}
.role[aria-expanded="true"]{grid-column:1 / -1}
.msg div:last-child{font-size:.97rem}
.role .secret{margin-top:6px}
.options{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--sheet);border:2px solid var(--rule);border-radius:6px;padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ballpoint);background:color-mix(in srgb,var(--ballpoint) 7%,var(--sheet))}
.opt .letter{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-weight:800;color:var(--ballpoint)}
.opt .lbl{font-weight:700}
.opt .det{color:var(--muted);font-size:.95rem}
label.field{display:block;font-weight:600;margin:14px 0 6px}
textarea,input[type=text],input[type=number]{width:100%;border:1px solid var(--rule);border-radius:6px;padding:10px 12px;background:var(--paper)}
textarea{min-height:84px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 10px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--minus);font-weight:600}
.gauges{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.gauge{margin:10px 0 14px}
.gauge .name{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem}
.gauge .def{color:var(--muted);font-size:.8rem;line-height:1.3}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:5px}
.cell{height:12px;border-radius:2px;background:var(--bar-bg)}
.cell.on{background:var(--ink)}
.gauge.low .cell.on{background:var(--alarm)}
.gauge .name .v{font-weight:800}
.delta{font-weight:800;margin-left:6px}
.delta.p{color:var(--plus)} .delta.m{color:var(--minus)}
.stamp{display:inline-block;border:3px solid var(--ballpoint);color:var(--ballpoint);padding:4px 10px;border-radius:4px;font-weight:800;transform:rotate(-2deg)}
@media (prefers-reduced-motion:no-preference){.stamp.fresh{animation:stamp .35s ease-out}}
@keyframes stamp{from{transform:rotate(-2deg) scale(1.6);opacity:0}to{transform:rotate(-2deg) scale(1);opacity:1}}
.effects{list-style:none;padding:0;margin:8px 0}
.effects li{padding:4px 0;border-bottom:1px solid var(--rule)}
.because{color:var(--ballpoint)}
.avis{border-left:4px solid var(--ballpoint);padding:6px 12px;margin:10px 0;font-style:italic}
.jokers{display:flex;gap:8px;flex-wrap:wrap}
.notice{background:color-mix(in srgb,var(--ballpoint) 9%,transparent);border-radius:6px;padding:10px 12px;margin:10px 0}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--rule);padding:7px 8px;text-align:left;vertical-align:top;font-size:.95rem}
th{font-weight:700}
.scroll{overflow-x:auto}
.big{font-size:clamp(4rem,14vw,10rem);font-weight:800;line-height:1;text-align:center;letter-spacing:.02em}
.big.late{color:var(--alarm)}
.code{font-weight:800;font-size:1.4rem;letter-spacing:.06em}
.dist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dist div{border:1px solid var(--rule);border-radius:6px;padding:8px}
footer{margin-top:28px;color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.hidden{display:none!important}
.tr{font-weight:800;font-size:1rem}
.tr.p{color:var(--plus)} .tr.m{color:var(--minus)} .tr.z{color:var(--muted)}
.trend{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
.tcell{display:inline-flex;flex-direction:column;align-items:center;min-width:28px;border:1px solid var(--rule);border-radius:4px;padding:2px 4px}
.tcell small{font-size:.7rem;color:var(--muted)}
.tcell.last{border-color:var(--ballpoint);border-width:2px}
.msgs{margin-top:6px}
.msg{border-left:3px solid var(--rule);padding:4px 10px;margin:8px 0}
.msgh{font-size:.85rem;color:var(--muted)}
.mission{border-top:1px solid var(--rule);padding-top:6px;margin-top:10px}
.steps li{margin:.35em 0;max-width:75ch}
.chrono{color:var(--muted);font-size:.9rem;margin-left:8px}
.chrono.late{color:var(--alarm);font-weight:700}
@media print{.noprint{display:none!important} body{background:#fff;color:#000} .sheet{border:none;box-shadow:none}}
.kind{display:inline-block;font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle;border:1px solid currentColor}
.kind.doctrine{color:var(--ballpoint)}
.kind.arbitrage{color:var(--amber)}
.budget{font-size:1.05rem;margin:4px 0 10px}
.palette{display:grid;gap:12px}
fieldset.cat{border:1px solid var(--rule);border-radius:6px;padding:8px 12px 12px;margin:0}
fieldset.cat legend{font-weight:700;padding:0 6px}
.bricks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.brick{border:2px solid var(--rule);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;justify-content:space-between;background:var(--sheet)}
.brick.on{border-color:var(--ballpoint);background:color-mix(in srgb,var(--ballpoint) 7%,var(--sheet))}
.bhead{display:flex;gap:10px;align-items:flex-start}
.bid{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--ballpoint);color:var(--ballpoint);display:grid;place-items:center;font-weight:800}
.blbl{font-weight:600;font-size:.97rem}
.bbtn{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;padding:6px 10px;font-weight:700;cursor:pointer;text-align:left}
.bbtn[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.bbtn:disabled{opacity:.4;cursor:not-allowed}
.bbtn.small{font-size:.88rem;padding:5px 8px}
.bbtn .cost{font-weight:400}
.delays{display:flex;flex-wrap:wrap;gap:6px}
.event{border:2px solid var(--alarm);border-radius:6px;padding:10px 12px;margin-top:10px;background:color-mix(in srgb,var(--alarm) 6%,transparent)}
.doc{border:1px solid var(--rule);border-left:4px solid var(--amber);border-radius:4px;padding:6px 12px;margin:8px 0;background:var(--paper)}
.doc p{margin:.3em 0}
.doch{font-size:.85rem;color:var(--muted)}
.doc img,.doc audio{max-width:100%;margin:6px 0}
ul.why{list-style:none;padding-left:18px;margin:4px 0 6px}
ul.why li{border:none;padding:2px 0;font-size:.95rem}
ul.cons li{margin:.3em 0}
.code.small{font-size:1rem;letter-spacing:0;word-break:break-word}
.tourbil{border-top:1px solid var(--rule);padding:8px 0}
.tourbil summary{cursor:pointer}
.prof{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.costhelp{margin-top:4px}
.costhelp summary{cursor:pointer}
.rolewrap{border:1px dashed var(--rule);border-radius:6px;padding:0}
.rolewrap.open{border-style:solid;border-color:var(--ballpoint);grid-column:1 / -1}
.rolewrap .role{border:none;width:100%}
.rolewrap .secret{padding:0 12px 10px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* Exercice de crise cyber – version 2. Source : specification.md (livrable validé du 17/11/2026) */
/* ============================================================
   Scénario v2 – CH de Montclair
   Source : projets/msos-m1-cyber/livrable_valide.md (§3 à §5)
   Jauges : soins, secu, confiance, conformite, si, equipes (0 à 10)
   Conditions : {t:tour, b:brique ou [briques], d:délai?} · {not:cond} · {all:[cond…]}
   ============================================================ */

const GAUGES = [
  {k:"soins", n:"Continuité des soins", c:"Soins", d:"Accueillir et soigner : services ouverts, délais, activité."},
  {k:"secu", n:"Sécurité des patients", c:"Sécu", d:"Le risque d'erreur ou de préjudice pour un patient pris en charge."},
  {k:"confiance", n:"Confiance", c:"Conf", d:"Ce que pensent l'ARS, le public et le personnel."},
  {k:"conformite", n:"Conformité", c:"Conform", d:"Les obligations : déclaration d'incident, CNIL, plainte."},
  {k:"si", n:"Système d'information", c:"SI", d:"Contenir l'incident et retrouver un système sain (cybersécurité)."},
  {k:"equipes", n:"Endurance des équipes", c:"Équipes", d:"La capacité du personnel à tenir dans la durée : charge, fatigue, moral."}
];
const START = {soins:6, secu:6, confiance:6, conformite:5, si:3, equipes:6};
const ROLES = ["Direction", "Informatique et sécurité", "Soins", "Communication et juridique"];
const ROLE_KEYS = ["direction", "informatique", "soins", "comjur"];

const DELAYS = {m:"maintenant", s:"ce soir", a:"aujourd'hui", l:"lundi", d:"demain avant 6 h 40", x:"après l'analyse complète"};

const MISSIONS = [
  {r:"Direction", m:"Vous pilotez la cellule de crise et vous tranchez quand le groupe ne s'accorde pas. Vous êtes l'interlocuteur de l'ARS (agence régionale de santé) et du conseil de surveillance. Le directeur est l'autorité responsable de la sécurité des systèmes d'information : la décision finale vous revient, et vous en répondez.",
   p:"Distribuer la parole, faire décider dans le temps, écrire chaque décision dans la main courante."},
  {r:"Informatique et sécurité", m:"Vous représentez le service informatique et le RSSI (responsable de la sécurité des systèmes d'information). Votre priorité : contenir l'attaque, protéger les sauvegardes, puis restaurer. Vous êtes l'interlocuteur du CERT Santé (le centre national d'appui aux établissements de santé face aux incidents de cybersécurité) et des prestataires.",
   p:"Dire clairement ce que vous savez, ce que vous ne savez pas, et combien de temps prendra chaque option."},
  {r:"Soins", m:"Vous représentez la direction des soins et les chefs de service. Votre priorité : que les patients présents et à venir soient pris en charge sans risque. Vous organisez le mode dégradé et vous êtes l'interlocuteur du SAMU et du CHU voisin.",
   p:"Rappeler à chaque décision ce qu'elle change, concrètement, au lit du patient."},
  {r:"Communication et juridique", m:"Vous portez la parole de l'hôpital vers le personnel, la presse, les patients et les familles. Vous veillez aussi aux obligations : déclaration d'incident, plainte, notification à la CNIL (Commission nationale de l'informatique et des libertés), avec le DPO (délégué à la protection des données).",
   p:"Vérifier à chaque tour qu'aucune obligation n'est oubliée, et qu'aucune phrase publique ne devra être démentie."}
];

/* Effet : {j:jauge, d:delta, why:"parce que…", v:[{if:condition, d:delta}]} */
const fx = (j, d, why, v) => v ? {j, d, why, v} : {j, d, why};

/* ---------------- Documents à lire (§5) ---------------- */
const DOCS = {
  D1:{tour:1, role:3, titre:"Courriel d'Infogest, reçu à 7 h 02",
      texte:"Objet : Rétablissement du service, demande d'accès\nBonjour, ici Marc D., support Infogest. Nos équipes sont prêtes à intervenir à distance dès maintenant. Merci de laisser ouvert notre accès à distance (VPN) habituel (identifiants inchangés depuis 2019). Notre accès est parfaitement sécurisé. Sans lui, aucune intervention avant 48 h. Merci de votre retour rapide."},
  D2:{tour:2, role:0, titre:"Message vocal de l'ARS, 9 h 55", media:null,
      texte:"« Bonjour, ici la permanence de l'ARS Occitanie. Nous devons savoir avant 11 h si vos urgences restent ouvertes et si vous déclenchez votre plan blanc, afin d'organiser avec le SAMU l'orientation des ambulances. Merci de nous confirmer votre décision par écrit. »"},
  D3:{tour:2, role:2, titre:"Note de la régulation du SAMU, 9 h 58",
      texte:"« Activité soutenue sur votre secteur : une ambulance toutes les 20 minutes en moyenne. Le CHU voisin peut accueillir des patients graves, pour une durée limitée. Un renfort de régulation médicale à distance est possible sur demande. »"},
  D4:{tour:3, role:3, titre:"Brouillon d'article de France 3 Occitanie, publication prévue à 13 h", media:null,
      texte:"« Hôpital de Montclair : écrans bloqués, patients soignés au papier. Depuis ce matin, le dossier informatique des patients est inaccessible. Des soignants évoquent un “piratage”. Des données ont-elles été dérobées ? La direction [réponse attendue]. »"},
  D5:{tour:3, role:2, titre:"Publication sur un réseau social, 11 h 47", media:null,
      texte:"« [Photo d'un écran bloqué] On soigne au papier depuis 6 h du matin. Personne ne nous dit rien. #Montclair »\n400 partages à 12 h 05."},
  D6:{tour:4, role:3, titre:"Note intersyndicale, dimanche 8 h 30",
      texte:"« Préavis de grève déposé à compter de lundi 18 h si la paie de novembre ne part pas. Nous exigeons le rétablissement des plannings de garde et une réponse écrite de la direction aujourd'hui. »"},
  D7:{tour:4, role:0, titre:"Courriel de la banque, dimanche 8 h 55",
      texte:"« Au vu de la situation, nous pouvons verser un acompte de 60 % de la masse salariale de novembre, contre un engagement écrit et daté de régularisation. Réponse attendue lundi à 12 h. »"},
  D8:{tour:5, role:3, titre:"Publication du groupe criminel, lundi 6 h 55", media:null,
      texte:"« CH Montclair. Premier lot publié : plannings du personnel, comptes rendus médicaux. Dans 48 h : dossiers de psychiatrie. Prix : 3 000 000 €. »"},
  D9:{tour:5, role:3, titre:"Courriel du DPO, lundi 7 h 10",
      texte:"« Rappel : le chiffrement du dossier patient constitue déjà une violation de données personnelles. Notification à la CNIL au plus tard mardi 6 h 40 (article 33 du RGPD, le règlement général sur la protection des données) : nous pouvons notifier aujourd'hui et compléter ensuite. Si le risque pour les personnes est élevé, nous devons les informer dans les meilleurs délais (article 34 du RGPD). »"},
  D10:{tour:6, role:2, titre:"Note de la DRH, mercredi 8 h",
      texte:"« Deux cadres de santé de la cellule dépassent 60 heures cette semaine. Cinq agents supplémentaires sont en arrêt depuis lundi. Les services demandent le retour de leurs cadres pour organiser le week-end. »"}
};

/* ---------------- Événements imprévus (§4) ---------------- */
const EVENTS = {
  E1:{tour:2, texte:"Épidémie de gastro-entérite sur le secteur : +40 % d'arrivées aux urgences depuis 9 h.",
      fx:[fx("soins",-1,"Plus d'arrivées aux urgences, avec les mêmes équipes."),
          fx("secu",-1,"Plus d'arrivées, donc plus de prescriptions faites sans historique.",[{if:{t:2,b:"A"}, d:0}])],
      mit:{if:{t:2,b:"A"}, txt:"Le délestage vers le CHU a amorti l'afflux de l'épidémie."}},
  E2:{tour:3, texte:"Douze agents ont reçu un courriel « de l'ARS » leur demandant de ressaisir leurs identifiants sur un lien. Trois ont cliqué.",
      fx:[fx("si",-1,"Des identifiants volés rouvrent une porte à l'attaquant.",[{if:{t:1,b:"E"}, d:0}])],
      mit:{if:{t:1,b:"E"}, txt:"La consigne de samedi matin mettait en garde contre les messages inhabituels : les trois agents ont prévenu l'informatique, et les comptes ont été bloqués à temps."}},
  E3:{tour:4, texte:"Le grossiste-répartiteur ne reçoit plus vos commandes électroniques de médicaments : la livraison de lundi est annulée.",
      fx:[fx("secu",-1,"Certains traitements risquent la rupture.",[{if:{t:4,b:"B"}, d:0}])],
      mit:{if:{t:4,b:"B"}, txt:"La pharmacie restaurée en priorité a pu repasser commande à temps."}},
  E4:{tour:5, texte:"Un patient suivi en psychiatrie appelle la cellule en direct : il a trouvé son nom sur le site du groupe criminel.",
      fx:[fx("confiance",-1,"Il apprend la fuite par l'attaquant avant d'avoir reçu votre message.",[{if:{t:5,b:"B",d:"a"}, d:0}]),
          fx("secu",-1,"Un patient fragile, laissé seul face à cette découverte, est exposé.",[{if:{t:5,b:"B",d:"a"}, d:0}])],
      mit:{if:{t:5,b:"B",d:"a"}, txt:"Le patient avait déjà été appelé ce matin par la cellule d'écoute : il est reçu en consultation dédiée."}},
  E5:{tour:6, texte:"Le prestataire de restauration ne reçoit plus par voie informatique les commandes de repas des services (régimes, allergies). Les repas de jeudi seront préparés sans ces informations.",
      fx:[fx("secu",-1,"Un repas inadapté peut provoquer un incident.",[{if:{t:6,b:["C","D"]}, d:0}]),
          fx("equipes",-1,"Les services doivent tout ressaisir à la main.")],
      mit:{if:{t:6,b:["C","D"]}, txt:"Les cadres présents dans la cellule relaient service par service les régimes et les allergies."}}
};
const EVENT_POOLS = {early:["E1","E2"], late:["E3","E4","E5"]};

/* ---------------- Fins (§3.7) ---------------- */
const ENDINGS = [
  {k:"secu", t:"Un patient en danger", d:"Un événement indésirable grave est survenu pendant le mode dégradé : une erreur de traitement chez un patient sans historique. Il est déclaré à l'ARS."},
  {k:"conformite", t:"Le dossier juridique", d:"Déclaration tardive, notification hors délai : l'ARS et la CNIL ouvrent une procédure."},
  {k:"confiance", t:"La confiance perdue", d:"La presse, le personnel et l'ARS ne croient plus la direction. L'ARS place l'hôpital sous accompagnement renforcé."},
  {k:"si", t:"La crise qui dure", d:"À J+7, une semaine après le début de la crise, le système n'est pas revenu, ou l'attaquant est revenu. La crise entre dans sa deuxième semaine."},
  {k:"equipes", t:"Les équipes épuisées", d:"L'hôpital fonctionne, mais les arrêts maladie se multiplient : les équipes ne tiennent plus."},
  {k:"soins", t:"L'hôpital à l'arrêt", d:"Les services tournent au ralenti : l'activité ne reprendra pas avant plusieurs semaines."}

/* ============================================================
   Moteur de calcul (déterministe, sans dépendance au DOM)
   Ordre de calcul d'un tour (§9.2) : situation → décisions → bonus
   → héritage → événement → écrêtage 0–10 une seule fois.
   Choix d'un groupe : tableau par tour de sélections [{b:"A", d:"m"|null}, …]
   ============================================================ */

const clamp = v => Math.max(0, Math.min(10, v));
const gName = k => GAUGES.find(x => x.k === k).n;
const gShort = k => GAUGES.find(x => x.k === k).c;
const fmt = d => (d > 0 ? "+" : d < 0 ? "−" : "±") + Math.abs(d);

/* ---------- conditions ---------- */
function picked(choices, t, b, d){
  const sel = choices[t - 1]; if(!sel) return false;
  const list = Array.isArray(b) ? b : [b];
  return sel.some(s => list.includes(s.b) && (!d || s.d === d));
}
function cond(c, choices){
  if(!c) return true;
  if(Array.isArray(c)) return c.some(x => cond(x, choices));
  if(c.not) return !cond(c.not, choices);
  if(c.all) return c.all.every(x => cond(x, choices));
  return picked(choices, c.t, c.b, c.d);
}

/* ---------- briques ---------- */
function brick(T, id){ return T.bricks.find(b => b.id === id); }
function options(B){ return B.opts ? B.opts : [{d:null, c:B.c, fx:B.fx, cq:B.cq, cqv:B.cqv}]; }
function option(B, d){ const o = options(B); return o.find(x => x.d === (d || null)) || o[0]; }
function delayLabel(o){ return o.dl || (o.d ? DELAYS[o.d] : ""); }
function cost(T, sel){ return sel.reduce((s, x) => s + option(brick(T, x.b), x.d).c, 0); }

/* Effet résolu : la première variante dont la condition est remplie remplace delta et phrase */
function resolve(f, choices){
  for(const v of (f.v || [])) if(cond(v.if, choices)) return {j:f.j, d:v.d, why:v.why || f.why};
  return {j:f.j, d:f.d, why:f.why};
}

/* ---------- validation d'une sélection ---------- */
function checkSelection(T, sel){
  const errs = [];
  for(const C of T.cats){
    const n = sel.filter(s => brick(T, s.b).cat === C.id).length;
    if(C.req && n === 0) errs.push(`Choisissez une action dans « ${C.n} ».`);
    if(C.excl && n > 1) errs.push(`Une seule action possible dans « ${C.n} ».`);
  }
  const c = cost(T, sel);
  if(c > T.budget) errs.push(`La cellule est trop sollicitée : ${c} créneaux pour ${T.budget} disponibles.`);
  return errs;
}

/* ---------- tirage des événements ---------- */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function drawEvents(seed){
  if(seed === null || seed === undefined || seed === "none") return [];
  const r = mulberry32(Number(seed) * 2654435761 >>> 0);
  const e = EVENT_POOLS.early[Math.floor(r() * EVENT_POOLS.early.length)];
  const l = EVENT_POOLS.late[Math.floor(r() * EVENT_POOLS.late.length)];
  return [e, l];
}

/* ---------- un tour ---------- */
function deferredFor(i, choices){
  const out = [];
  TOURS.forEach(T => (T.deferred || []).forEach(D => {
    if(D.apply === i + 1 && cond(D.when, choices)) out.push(D);
  }));
  return out;
}
function comboActive(req, sel){
  return req.every(r => { const [b, d] = r.split("."); return sel.some(s => s.b === b && (!d || s.d === d)); });
}
function catOrder(T, id){ const B = brick(T, id); const k = T.cats.findIndex(c => c.id === B.cat); return k < 0 ? 99 : k; }

function applyTour(g, choices, i, events){
  const T = TOURS[i], sel = choices[i] || [];
  const items = []; const cons = [];
  const add = (src, label, f) => { const r = resolve(f, choices); if(r.d !== 0) items.push({src, label, ...r}); else if(f.v) items.push({src, label, ...r, neutral:true}); };

  // 1. situation
  (T.pressure || []).forEach(f => add("situation", "Situation", f));
  // 2. décisions (ordre : catégories exclusives, puis facultatives par ordre alphabétique)
  const sorted = [...sel].sort((a, b) => catOrder(T, a.b) - catOrder(T, b.b) || a.b.localeCompare(b.b));
  const decCons = [];
  sorted.forEach(s => {
    const B = brick(T, s.b), o = option(B, s.d);
    const lab = s.b + (s.d ? " (" + delayLabel(o) + ")" : "");
    o.fx.forEach(f => add("decision", lab, f));
    let txt = o.cq; for(const v of (o.cqv || [])) if(cond(v.if, choices)){ txt = v.txt; break; }
    decCons.push(txt);
  });
  // 3. bonus (deux au plus)
  const bonusCons = [];
  (T.combos || []).filter(C => comboActive(C.req, sel)).slice(0, 2).forEach(C => {
    C.fx.forEach(f => add("bonus", "Bonus " + C.req.join(" + "), f)); bonusCons.push(C.cq);
  });
  // 4. héritage
  const herCons = [];
  deferredFor(i, choices).forEach(D => {
    if(D.cancelledBy && cond(D.cancelledBy, choices)){ if(D.cancelTxt) herCons.push(D.cancelTxt); return; }
    D.fx.forEach(f => { add("heritage", "Décision passée", f); herCons.push(resolve(f, choices).why); });
  });
  // 5. événement
  const evCons = []; let event = null;
  (events || []).forEach(id => { const E = EVENTS[id]; if(E.tour !== i + 1) return; event = id;
    E.fx.forEach(f => add("evenement", "Imprévu", f));
    if(E.mit && cond(E.mit.if, choices)) evCons.push(E.mit.txt);
  });
  // 6. écrêtage une seule fois
  const before = {...g}, net = {};
  GAUGES.forEach(x => { net[x.k] = items.filter(it => it.j === x.k && !it.neutral).reduce((s, it) => s + it.d, 0); });
  GAUGES.forEach(x => { g[x.k] = clamp(g[x.k] + net[x.k]); });
  const sums = {};
  ["situation", "decision", "bonus", "heritage", "evenement"].forEach(src => {
    sums[src] = {}; GAUGES.forEach(x => sums[src][x.k] = items.filter(it => it.src === src && it.j === x.k && !it.neutral).reduce((s, it) => s + it.d, 0));
  });
  cons.push(...herCons, ...decCons, ...bonusCons, ...evCons);
  return {before, after:{...g}, net, items:items.filter(it => !it.neutral), neutral:items.filter(it => it.neutral), cons, sums, event};
}

function simulate(choices, events){
  const g = {...START}; const steps = [];
  for(let i = 0; i < choices.length; i++) steps.push(applyTour(g, choices, i, events));
  return {g, steps};
}

/* ---------- fin de crise (§3.7) ---------- */
function ending(g){
  for(const E of ENDINGS) if(g[E.k] <= 2) return {...E, level:"echec", pts:END_POINTS.echec};
  const low = GAUGES.filter(x => g[x.k] <= 4);
  if(low.length){
    const min = Math.min(...low.map(x => g[x.k]));
    const names = low.filter(x => g[x.k] === min).map(x => x.n.toLowerCase());
    const jauges = names.length > 1 ? names.slice(0, -1).join(", ") + " et " + names[names.length - 1] + " restent fragiles" : names[0] + " reste fragile";
    return {t:JUSTESSE.t, d:JUSTESSE.d.replace("{jauge} reste fragile", jauges), level:"justesse", pts:END_POINTS.justesse, low:low.map(x => x.k)};
  }
  return {...TENU, level:"tenu", pts:END_POINTS.tenu};
}

/* ---------- code de trajectoire ---------- */
function tourCode(sel){ return [...sel].sort((a, b) => a.b.localeCompare(b.b)).map(s => s.b + (s.d || "")).join("+"); }
function trajectory(choices){ return choices.map((sel, i) => `${i + 1}:${tourCode(sel)}`).join(" | "); }
function parseTrajectory(str){
  const choices = [];
  for(const part of str.split("|")){
    const m = part.trim().match(/^([1-6])\s*:\s*([A-F][a-z]?(?:\s*\+\s*[A-F][a-z]?)*)$/);
    if(!m) return null;
    choices[Number(m[1]) - 1] = m[2].split("+").map(x => { x = x.trim(); return {b:x[0], d:x[1] || null}; });
  }
  if(choices.length !== TOURS.length) return null;
  for(let i = 0; i < choices.length; i++) if(!choices[i]) return null;
  return choices;
}

/* ---------- combinaisons valides d'un tour (pour la calibration et l'enseignant) ---------- */
function allSelections(T){
  const lists = T.bricks.map(B => [null, ...options(B).map(o => ({b:B.id, d:o.d}))]);
  const out = [];
  const rec = (k, acc) => {
    if(k === lists.length){ if(!checkSelection(T, acc).length) out.push(acc); return; }
    for(const x of lists[k]) rec(k + 1, x ? [...acc, x] : acc);
  };
  rec(0, []);
  return out;
}

/* ---------------- un tour ---------------- */
function pastBlock(i){
  const ch = choices();
  const lines = [];
  (TOURS[i].past || []).forEach(p => { if(cond(p.if, ch)) lines.push(p.txt); });
  TOURS.forEach(T => (T.deferred || []).forEach(D => { if(D.apply === i + 1 && D.screen && cond(D.when, ch)) lines.push(D.screen); }));
  return lines;
}

    return h("li", {}, arrow(st.net[x.k]), " ", h("b", {}, x.n), st.net[x.k] === 0 ? h("span", {class:"meta"}, onlyNeutral ? " : sans effet, et voici pourquoi" : " : les effets se compensent") : "",
      h("ul", {class:"why"}, its.map(it => h("li", {}, arrow(it.d), " ", it.src === "situation" ? "Situation : " : it.src === "heritage" ? "Décision passée : " : it.src === "evenement" ? "Imprévu : " : "", it.why))));

      h("p", {class:"meta"}, "Totaux avant plafonnement : une jauge ne descend jamais sous 0 ni ne dépasse 10, c'est pourquoi les totaux ne s'additionnent pas toujours aux valeurs finales."),
      events().length ? h("p", {class:"meta"}, "Imprévus de votre partie : " + events().map(id => EVENTS[id].texte).join(" / ")) : h("p", {class:"meta"}, "Partie jouée sans imprévu.")),
    h("div", {class:"sheet"},
      h("h2", {style:"margin-top:0"}, "Votre trajectoire, avec les valeurs"),
      h("p", {class:"meta"}, "Ce tableau montre enfin le poids de chaque décision. Quelle décision a le plus pesé ?"),
      h("p", {class:"meta"}, "Deux sortes de tours : sur les tours « doctrine », les autorités attendaient une réponse précise ; sur les tours « arbitrage », il n'y avait pas de bonne réponse unique. L'enseignant y revient au débrief."),
      choices().map((sel, i) => { const st = sim.steps[i];
        return h("details", {class:"tourbil", open:i === 2 || i === 4},
          h("summary", {}, h("b", {}, `Tour ${i + 1} – ${TOURS[i].t}`), " ", kindBadge(TOURS[i])),
          h("ul", {}, [...sel].sort((a, b) => a.b.localeCompare(b.b)).map(x => { const B = brick(TOURS[i], x.b); return h("li", {}, h("b", {}, x.b + " "), B.l + (x.d ? " — " + delayLabel(option(B, x.d)) : "")); })),
          GAUGES.some(x => st.before[x.k] + st.net[x.k] !== st.after[x.k]) ? h("p", {class:"meta"}, "Plafonnement : " + GAUGES.filter(x => st.before[x.k] + st.net[x.k] !== st.after[x.k]).map(x => `${x.c} ${st.before[x.k]} ${fmt(st.net[x.k])} ramenée à ${st.after[x.k]}`).join(" ; ") + " (une jauge reste entre 0 et 10).") : "",
          S.just[i] ? h("p", {class:"meta"}, "Justification : « " + S.just[i] + " »") : "",
          h("ul", {class:"effects"}, st.items.map(it => h("li", {}, h("b", {}, `${gShort(it.j)} ${fmt(it.d)}`), " · ", h("span", {class:"meta"}, srcName[it.src] + (it.src === "decision" || it.src === "bonus" ? " " + it.label : "") + " : "), it.why))),
          h("ul", {class:"cons"}, st.cons.map(c => h("li", {}, c)))); })),
    h("div", {class:"sheet noprint"},
      h("h2", {style:"margin-top:0"}, "Terminer la partie"),
      h("p", {}, "Avant le débrief, répondez ensemble à ces trois questions : l'enseignant pourra désigner n'importe quel membre du groupe pour y répondre. Les réponses sont facultatives."),
      REFLECT.map((q, k) => [h("label", {class:"field", for:"q" + k}, q), areas[k]]),
      S.done ? h("p", {class:"notice", role:"status"}, h("b", {}, "Partie terminée. "), "Vos réponses sont enregistrées. Copiez le code en haut de cette page et donnez-le à l'enseignant : il s'en sert pour comparer les groupes au débrief. Vous pouvez encore modifier vos réponses.")
             : h("div", {class:"row", style:"margin-top:12px"}, h("button", {class:"btn", onclick:() => { S.done = true; save(); render(); }}, "Enregistrer nos réponses et terminer"))));
  app.append(h("div", {class:"grid"}, main, gaugePanel(sim.g)));
  app.append(footer());
}

/* ---------------- pied de page et fonctions enseignant ---------------- */
function canForce(next){ // un imprévu forcé ne peut ni effacer ni ajouter un imprévu sur un tour déjà joué
  const done = (S.choices || []).length;
  const played = events().filter(id => EVENTS[id].tour <= done);
  return played.every(id => next.includes(id)) && next.every(id => played.includes(id) || EVENTS[id].tour > done);
}
function footer(){
  const box = h("div", {class:"hidden prof"});
  const inp = h("input", {type:"text", placeholder:"Code enseignant", autocomplete:"off", style:"max-width:200px"});
  const actions = h("div", {class:"row hidden"},
    h("button", {class:"btn ghost small", onclick:() => { if(confirm("Effacer cette partie ? Cette action est définitive.")){ try{ localStorage.removeItem(KEY); }catch(e){} S = {screen:"home"}; render(); } }}, "Réinitialiser la partie"),
    S.choices && S.choices.length ? h("button", {class:"btn ghost small", onclick:() => { S.screen = "end"; save(); render(); }}, "Aller au bilan") : "",
    h("label", {class:"meta"}, "Forcer l'imprévu : ",
      h("select", {onchange:(e) => { const v = e.target.value; if(!v) return; S.events = v === "none" ? [] : v.split(","); S.forcedEv = true; save(); render(); }},
        h("option", {value:""}, "—"), h("option", {value:"none", disabled:!canForce([])}, "aucun"),
        EVENT_POOLS.early.flatMap(a => EVENT_POOLS.late.map(b => h("option", {value:a + "," + b, disabled:!canForce([a, b])}, a + " et " + b))))),
    S.screen === "tour" ? h("button", {class:"btn ghost small", onclick:() => { S.noMin = !S.noMin; save(); render(); }}, S.noMin ? "Rétablir le délai de 5 minutes" : "Lever le délai de 5 minutes") : "",
    h("p", {class:"meta"}, "On ne peut forcer qu'un imprévu dont le tour n'est pas encore joué ; le code exporté l'indique alors (E:…)."));
  const okBtn = h("button", {class:"btn small", onclick:() => unlockF()}, "OK");
  const unlockF = () => { if(inp.value.trim().toUpperCase() === "PROF"){ inp.classList.add("hidden"); okBtn.classList.add("hidden"); actions.classList.remove("hidden"); } else inp.value = ""; };
  inp.addEventListener("keydown", e => { if(e.key === "Enter") unlockF(); });
  box.append(inp, okBtn, actions);
  return h("footer", {class:"noprint"},
    h("span", {}, "Scénario fictif, construit pour un exercice de formation."),
    S.screen && S.screen !== "home" ? h("div", {class:"row"},
      h("button", {class:"btn ghost small", onclick:() => { const v = prompt(`Recommencer depuis le début ? Toute la partie du groupe ${S.group} sera effacée sur cet ordinateur.\nPour confirmer, tapez le numéro du groupe (${S.group}).`); if(v !== null && v.trim() === String(S.group)){ try{ localStorage.removeItem(KEY); }catch(e){} S = {screen:"home"}; render(); } }}, "Recommencer la partie"),
      h("button", {class:"btn ghost small", onclick:() => box.classList.toggle("hidden")}, "Enseignant")) : "", box);
}

/* ============================================================
   Écran animateur (#animateur)
   ============================================================ */
const A = (() => { try{ return JSON.parse(localStorage.getItem(KEY + "-anim")) || {}; }catch(e){ return {}; } })();
function saveA(){ try{ localStorage.setItem(KEY + "-anim", JSON.stringify(A)); }catch(e){} }
function renderAnim(){
  A.dur = A.dur || 120 * 60; A.left = A.left ?? A.dur; A.run = A.run || false; A.codes = A.codes || "";
  if(!A.seed){ A.seed = String(Math.floor(Math.random() * 9000) + 1000); saveA(); }
  app.append(h("header", {class:"top"},
    h("div", {class:"brand"}, "Écran animateur", h("small", {}, "Exercice de crise cyber – CH de Montclair")),
    h("a", {href:"#", class:"meta", onclick:(e) => { e.preventDefault(); history.replaceState(null, "", location.pathname + location.search); render(); }}, "Revenir à l'écran des groupes")));
  const seedEv = drawEvents(Number(A.seed));
  app.append(h("section", {class:"sheet"},
    h("h2", {style:"margin-top:0"}, "Numéro de séance, à projeter"),
    h("div", {class:"big"}, A.seed),
    h("p", {class:"meta", style:"text-align:center"}, "Chaque groupe le saisit à l'ouverture de la cellule : tous vivent les mêmes imprévus, sans les connaître d'avance."),
    h("details", {}, h("summary", {class:"meta"}, "Voir les imprévus de cette séance (ne pas projeter)"),
      h("ul", {}, seedEv.map(id => h("li", {}, h("b", {}, `${id}, tour ${EVENTS[id].tour} : `), EVENTS[id].texte)))),
    h("div", {class:"row", style:"justify-content:center"}, h("button", {class:"btn ghost small", onclick:() => { A.seed = String(Math.floor(Math.random() * 9000) + 1000); saveA(); render(); }}, "Tirer un autre numéro"))));

  const big = h("div", {class:"big"});
  const paint = () => { const s = Math.max(0, A.left); big.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; big.classList.toggle("late", A.left <= 10 * 60); };
  paint();
  if(A.run){ A.endAt = A.endAt || (Date.now() + A.left * 1000); ticker = setInterval(() => { A.left = Math.max(0, Math.round((A.endAt - Date.now()) / 1000)); paint(); if(A.left <= 0){ A.run = false; clearInterval(ticker); } saveA(); }, 1000); }
  const durIn = h("input", {type:"number", min:"10", max:"240", value:String(Math.round(A.dur / 60)), style:"width:90px"});
  app.append(h("section", {class:"sheet"},
    h("h2", {style:"margin-top:0"}, "Temps de jeu restant"), big,
    h("div", {class:"row", style:"justify-content:center;margin:10px 0"},
      h("button", {class:"btn", onclick:() => { if(A.run){ A.run = false; A.endAt = null; } else { A.run = true; A.endAt = Date.now() + A.left * 1000; } saveA(); render(); }}, A.run ? "Mettre en pause" : "Démarrer"),
      h("button", {class:"btn ghost", onclick:() => { A.dur = Math.max(10, parseInt(durIn.value, 10) || 120) * 60; A.left = A.dur; A.run = false; A.endAt = null; saveA(); render(); }}, "Remettre à zéro"),
      h("label", {class:"meta"}, " Durée (min) ", durIn)),
    h("p", {class:"meta", style:"text-align:center"}, "Environ 20 minutes par tour, 5 minutes au minimum. Le bilan s'affiche automatiquement après le tour 6.")));

  const ta = h("textarea", {placeholder:"Un code par ligne, tel que copié depuis le bilan des groupes"}, A.codes);
  const out = h("div", {});
  const compare = () => {
    A.codes = ta.value; saveA(); out.innerHTML = "";
    const rows = [], bad = [];
    ta.value.split(/\n+/).map(s => s.trim()).filter(Boolean).forEach(s => {
      const m = s.match(/^G\s*(\d+)\s*·\s*(S\d{4}|sans imprévu|E:aucun|E:E\d(?:\+E\d)?)\s*·\s*(.+)$/);
      const ch = m ? parseTrajectory(m[3]) : null;
      if(!m){ if(/^G\s*\d+\s*·/.test(s)) bad.push(s); return; }
      if(!ch){ bad.push(s + " (trajectoire incomplète)"); return; }
      const ev = m[2] === "sans imprévu" || m[2] === "E:aucun" ? [] : m[2].startsWith("E:") ? m[2].slice(2).split("+") : drawEvents(Number(m[2].slice(1)));
      if(ev.some(id => !EVENTS[id])){ bad.push(s + " (imprévu inconnu)"); return; }
      rows.push({grp:Number(m[1]), ch, ev, sim:simulate(ch, ev)});
    });
    if(bad.length) out.append(h("p", {class:"err"}, "Codes non reconnus : " + bad.join(" / ")));
    if(!rows.length){ out.append(h("p", {class:"meta"}, "Collez les codes copiés depuis le bilan des groupes.")); return; }
    rows.sort((a, b) => a.grp - b.grp);
    out.append(h("h3", {}, "Trajectoires"), h("div", {class:"scroll"}, h("table", {},
      h("tr", {}, h("th", {}, "Groupe"), TOURS.map((t, i) => h("th", {}, `T${i + 1}`)), GAUGES.map(x => h("th", {title:x.n}, x.c)), h("th", {}, "Imprévus"), h("th", {}, "Fin"), h("th", {}, "Points de fin")),
      rows.map(r => { const e = ending(r.sim.g), evs = fmtSums(sumBy(r.sim, ["evenement"]));
        return h("tr", {}, h("td", {}, h("b", {}, "G" + r.grp)), r.ch.map(s => h("td", {}, tourCode(s))), GAUGES.map(x => h("td", {style:r.sim.g[x.k] <= 4 ? "color:var(--alarm);font-weight:800" : ""}, r.sim.g[x.k])), h("td", {class:"meta"}, evs), h("td", {}, e.t), h("td", {}, e.pts)); }))));
    out.append(h("h3", {}, "Répartition des choix, tour par tour"));
    TOURS.forEach((t, i) => {
      const cnt = new Map(); rows.forEach(r => { const c = tourCode(r.ch[i]); cnt.set(c, [...(cnt.get(c) || []), "G" + r.grp]); });
      out.append(h("p", {}, h("b", {}, `Tour ${i + 1} (${t.kind}) : `), [...cnt].map(([c, g]) => `${c} → ${g.join(", ")}`).join(" ; ")));
    });
  };
  app.append(h("section", {class:"sheet"},
    h("h2", {style:"margin-top:0"}, "Comparer les trajectoires (slide S7)"),
    ta, h("div", {class:"row", style:"margin:10px 0"}, h("button", {class:"btn", onclick:compare}, "Afficher la comparaison")), out));
  if(A.codes) compare();

  const ref = h("section", {class:"sheet" + (A.unlocked ? "" : " hidden")},
    h("p", {class:"meta"}, "Mode test, pour essayer le jeu sans attente ni justification : ", h("a", {href:"#test"}, "ouvrir le mode test"), ". Ne le donnez pas aux étudiants."),
    h("h2", {}, "Référence du scénario, pour le débriefing"),
    h("p", {class:"meta"}, "Effets de base de chaque action. Entre parenthèses : les variantes selon les choix précédents."),
    TOURS.map((T, i) => h("div", {},
      h("h3", {}, `Tour ${i + 1} – ${T.when} : ${T.t} `, kindBadge(T)),
      h("p", {}, h("b", {}, "Pour le débrief : "), T.debrief.best, " ", h("span", {class:"meta"}, "Pièges : " + T.debrief.pieges)),
      T.pressure.length ? h("p", {class:"meta"}, "Effet de la situation : " + T.pressure.map(f => `${gShort(f.j)} ${fmt(f.d)}`).join(", ")) : "",
      h("div", {class:"scroll"}, h("table", {},
        h("tr", {}, h("th", {}, "Action"), h("th", {}, "Créneaux"), h("th", {}, "Effets")),
        T.bricks.flatMap(B => options(B).map(o => h("tr", {},
          h("td", {}, h("b", {}, B.id + (o.d || "") + " "), B.l, o.d ? " (" + delayLabel(o) + ")" : "", B.cat ? " 🔒" : ""),
          h("td", {}, o.c),
          h("td", {}, o.fx.map(f => h("div", {}, `${gShort(f.j)} ${fmt(f.d)}`, (f.v || []).map(v => ` (${fmt(v.d)} si ${JSON.stringify(v.if).replace(/[{}"]/g, "")})`), h("span", {class:"meta"}, " : " + f.why))))))))),
      (T.combos || []).map(C => h("p", {class:"meta"}, "Bonus " + C.req.join(" + ") + " : " + C.fx.map(f => `${gShort(f.j)} ${fmt(f.d)}`).join(", "))),
      h("details", {}, h("summary", {class:"meta"}, "Ce que les cartes doivent faire émerger"),
        h("ul", {},
          h("li", {}, h("b", {}, "Réflexes : "), T.debrief.reflexes.map(r => r + " – " + REFLEXES[r]).join(" ")),
          h("li", {}, h("b", {}, "Contradiction entre cartes : "), T.debrief.contra),
          h("li", {}, h("b", {}, "Fausses informations : "), T.debrief.faux.join(" ; ")),
          T.cards.map((c, k) => c.faux ? h("li", {}, h("b", {}, ROLES[k] + " : "), c.faux) : ""))))));
  const lockIn = h("input", {type:"password", placeholder:"Code enseignant", autocomplete:"off", style:"max-width:200px"});
  const unlock = () => { if(lockIn.value.trim().toUpperCase() === "PROF"){ A.unlocked = true; saveA(); render(); } else lockIn.value = ""; };
  lockIn.addEventListener("keydown", e => { if(e.key === "Enter") unlock(); });
  const lock = h("section", {class:"sheet noprint" + (A.unlocked ? " hidden" : "")},
    h("h2", {style:"margin-top:0"}, "Référence du scénario et mode test"),
    h("p", {class:"meta"}, "Réservés à l'enseignant, pour ne pas montrer les réponses si cet écran est projeté."), h("div", {class:"row"}, lockIn, h("button", {class:"btn small", onclick:unlock}, "OK")));
  app.append(lock, ref,
    A.unlocked ? h("p", {class:"noprint"}, h("button", {class:"btn ghost small", onclick:() => { A.unlocked = false; saveA(); render(); }}, "Masquer la référence")) : "");
}

render();

</script>
