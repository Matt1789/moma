<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cellule de crise – CH de Montclair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F6; --sheet:#FFFFFF; --ink:#16233A; --muted:#55627A; --rule:#C9D3DF;
  --ballpoint:#1F3A93; --alarm:#C8102E; --plus:#1E7A3C; --minus:#B3261E; --amber:#9A5B00;
  --bar-bg:#DDE4EC; --focus:#1F3A93; --shadow:0 1px 0 rgba(22,35,58,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1724; --sheet:#172235; --ink:#E7EDF5; --muted:#A3B0C4; --rule:#2B3A52;
    --ballpoint:#8FB0FF; --alarm:#FF6B7D; --plus:#6FD08C; --minus:#FF8A80; --amber:#F2B45A;
    --bar-bg:#24324A; --focus:#8FB0FF; --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1724; --sheet:#172235; --ink:#E7EDF5; --muted:#A3B0C4; --rule:#2B3A52;
  --ballpoint:#8FB0FF; --alarm:#FF6B7D; --plus:#6FD08C; --minus:#FF8A80; --amber:#F2B45A;
  --bar-bg:#24324A; --focus:#8FB0FF; --shadow:none; color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:16px 20px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.brand{font-weight:800;font-size:1.05rem;letter-spacing:.01em}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.clock{font-weight:700;color:var(--alarm);font-size:1.05rem}
.meta{color:var(--muted);font-size:.9rem}
h1{font-size:2rem;line-height:1.15;margin:.2em 0 .3em;font-weight:800}
h2{font-size:1.3rem;margin:1.2em 0 .5em;font-weight:700}
h3{font-size:1.05rem;margin:.8em 0 .3em}
p{margin:.4em 0 .8em;max-width:75ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;box-shadow:var(--shadow)}
.sheet + .sheet{margin-top:16px}
.situation{border-left:6px solid var(--alarm)}
.situation .when{font-weight:700;color:var(--alarm)}
.variant{background:color-mix(in srgb,var(--alarm) 8%,transparent);border-radius:4px;padding:8px 12px;margin-top:8px}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
@media (max-width:600px){.roles{grid-template-columns:1fr}}
.role{border:1px dashed var(--rule);border-radius:6px;padding:10px 12px;background:transparent;text-align:left;cursor:pointer;width:100%}
.role > b{display:block}
.role .hint{color:var(--muted);font-size:.9rem}
.role[aria-expanded="true"]{border-style:solid;border-color:var(--ballpoint)}
.role[aria-expanded="true"]{grid-column:1 / -1}
.msg div:last-child{font-size:.97rem}
.role .secret{margin-top:6px}
.options{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--sheet);border:2px solid var(--rule);border-radius:6px;padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ballpoint);background:color-mix(in srgb,var(--ballpoint) 7%,var(--sheet))}
.opt .letter{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-weight:800;color:var(--ballpoint)}
.opt .lbl{font-weight:700}
.opt .det{color:var(--muted);font-size:.95rem}
label.field{display:block;font-weight:600;margin:14px 0 6px}
textarea,input[type=text],input[type=number]{width:100%;border:1px solid var(--rule);border-radius:6px;padding:10px 12px;background:var(--paper)}
textarea{min-height:84px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 10px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--minus);font-weight:600}
.gauges{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.gauge{margin:10px 0 14px}
.gauge .name{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem}
.gauge .def{color:var(--muted);font-size:.8rem;line-height:1.3}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:5px}
.cell{height:12px;border-radius:2px;background:var(--bar-bg)}
.cell.on{background:var(--ink)}
.gauge.low .cell.on{background:var(--alarm)}
.gauge .name .v{font-weight:800}
.delta{font-weight:800;margin-left:6px}
.delta.p{color:var(--plus)} .delta.m{color:var(--minus)}
.stamp{display:inline-block;border:3px solid var(--ballpoint);color:var(--ballpoint);padding:4px 10px;border-radius:4px;font-weight:800;transform:rotate(-2deg)}
@media (prefers-reduced-motion:no-preference){.stamp.fresh{animation:stamp .35s ease-out}}
@keyframes stamp{from{transform:rotate(-2deg) scale(1.6);opacity:0}to{transform:rotate(-2deg) scale(1);opacity:1}}
.effects{list-style:none;padding:0;margin:8px 0}
.effects li{padding:4px 0;border-bottom:1px solid var(--rule)}
.because{color:var(--ballpoint)}
.avis{border-left:4px solid var(--ballpoint);padding:6px 12px;margin:10px 0;font-style:italic}
.jokers{display:flex;gap:8px;flex-wrap:wrap}
.notice{background:color-mix(in srgb,var(--ballpoint) 9%,transparent);border-radius:6px;padding:10px 12px;margin:10px 0}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--rule);padding:7px 8px;text-align:left;vertical-align:top;font-size:.95rem}
th{font-weight:700}
.scroll{overflow-x:auto}
.big{font-size:clamp(4rem,14vw,10rem);font-weight:800;line-height:1;text-align:center;letter-spacing:.02em}
.big.late{color:var(--alarm)}
.code{font-weight:800;font-size:1.4rem;letter-spacing:.06em}
.dist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dist div{border:1px solid var(--rule);border-radius:6px;padding:8px}
footer{margin-top:28px;color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.hidden{display:none!important}
.tr{font-weight:800;font-size:1rem}
.tr.p{color:var(--plus)} .tr.m{color:var(--minus)} .tr.z{color:var(--muted)}
.trend{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
.tcell{display:inline-flex;flex-direction:column;align-items:center;min-width:28px;border:1px solid var(--rule);border-radius:4px;padding:2px 4px}
.tcell small{font-size:.7rem;color:var(--muted)}
.tcell.last{border-color:var(--ballpoint);border-width:2px}
.msgs{margin-top:6px}
.msg{border-left:3px solid var(--rule);padding:4px 10px;margin:8px 0}
.msgh{font-size:.85rem;color:var(--muted)}
.mission{border-top:1px solid var(--rule);padding-top:6px;margin-top:10px}
.steps li{margin:.35em 0;max-width:75ch}
.chrono{color:var(--muted);font-size:.9rem;margin-left:8px}
.chrono.late{color:var(--alarm);font-weight:700}
@media print{.noprint{display:none!important} body{background:#fff;color:#000} .sheet{border:none;box-shadow:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";
/* ============================================================
   Scénario – CH de Montclair. Barème validé (version 3).
   Jauges : soins, secu, confiance, conformite, si, equipes
   ============================================================ */
const GAUGES = [
  {k:"soins", n:"Continuité des soins", d:"Accueillir et soigner : services ouverts, délais, activité."},
  {k:"secu", n:"Sécurité des patients", d:"Le risque d'erreur ou de préjudice pour un patient pris en charge."},
  {k:"confiance", n:"Confiance", d:"Ce que pensent l'ARS, le public et le personnel."},
  {k:"conformite", n:"Conformité", d:"Les obligations : déclaration d'incident, CNIL, plainte."},
  {k:"si", n:"Système d'information", d:"Maîtriser l'attaque et retrouver un système sain (cybersécurité)."},
  {k:"equipes", n:"Endurance des équipes", d:"La capacité du personnel à tenir dans la durée : charge, fatigue, moral."}
];
const START = {soins:6, secu:6, confiance:6, conformite:5, si:3, equipes:6};
const CODE_BILAN = "BILAN";
const ROLES = ["Direction", "Informatique et sécurité", "Soins", "Communication et juridique"];

const MISSIONS = [
  {r:"Direction", m:"Vous pilotez la cellule de crise et vous tranchez quand le groupe ne s'accorde pas. Vous êtes l'interlocuteur de l'ARS et du conseil de surveillance. Le directeur est l'autorité responsable de la sécurité des systèmes d'information : la décision finale vous revient, et vous devrez la justifier.",
   p:"Distribuer la parole, faire décider dans le temps, écrire chaque décision dans la main courante."},
  {r:"Informatique et sécurité", m:"Vous représentez le service informatique et le RSSI. Votre priorité : contenir l'attaque, protéger les sauvegardes, puis restaurer. Vous êtes l'interlocuteur du CERT Santé et des prestataires.",
   p:"Dire clairement ce que vous savez, ce que vous ne savez pas, et combien de temps prendra chaque option."},
  {r:"Soins", m:"Vous représentez la direction des soins et les chefs de service. Votre priorité : que les patients présents et à venir soient pris en charge sans risque. Vous organisez le mode dégradé et vous êtes l'interlocuteur du SAMU et du CHU voisin.",
   p:"Rappeler à chaque décision ce qu'elle change, concrètement, au lit du patient."},
  {r:"Communication et juridique", m:"Vous portez la parole de l'hôpital vers le personnel, la presse, les patients et les familles. Vous veillez aussi aux obligations : déclaration d'incident, plainte, notification à la CNIL, avec le DPO.",
   p:"Vérifier à chaque tour qu'aucune obligation n'est oubliée, et qu'aucune phrase publique ne devra être démentie."}
];

const TOURS = [
 { t:"Couper ou contenir", when:"Samedi, 6 h 40",
   sit:() => ["Depuis 6 h 15, les infirmières de nuit ne peuvent plus ouvrir le dossier patient. Sur tous les postes, un message dans une langue étrangère réclame 3 millions d'euros et affiche un compte à rebours de 72 heures.",
              "L'astreinte informatique a repéré une connexion inhabituelle cette nuit à 3 h 12, par l'accès à distance (VPN) du prestataire de maintenance. L'astreinte de direction vous a convoqués en salle de crise. Première décision : que fait-on du réseau ?"],
   variants:() => [],
   roles:[
    {s:"Le prestataire promet un diagnostic à 10 h et demande de ne rien toucher d'ici là. Le directeur général du GHT est injoignable avant 9 h.", d:"Ne pas arrêter seul tout l'hôpital sans avoir mesuré ce que cela coûte aux soins."},
    {s:"Le laboratoire et l'imagerie tournent encore, mais sur les mêmes serveurs que le dossier patient. Les sauvegardes de la nuit sont sur le réseau.", d:"Chaque minute compte : tant que l'attaquant est dans le réseau, il peut atteindre les sauvegardes."},
    {s:"La procédure papier des urgences existe, mais elle n'a pas été exercée depuis deux ans. Trente-huit patients sont aux urgences.", d:"Ce qui marche encore, le laboratoire surtout, doit continuer de marcher le plus longtemps possible."},
    {s:"Des soignants postent des photos des écrans sur les réseaux sociaux. Un journaliste local en a déjà partagé une.", d:"Quoi que vous décidiez, le personnel doit recevoir une consigne dans l'heure."}],
   hint:"Dans le doute sur la propagation, isoler coûte moins cher que restaurer. Mais isoler n'est pas éteindre : l'enquête aura besoin des machines allumées.",
   opts:[
    { l:"Déconnecter tout l'hôpital du réseau et d'internet, sans éteindre les machines", det:"Le laboratoire, l'imagerie et la messagerie sont coupés aussi.",
      fx:()=>({e:{soins:-2, equipes:-1, si:+2}, why:[]}),
      cq:"À 7 h 05, tout est coupé. La propagation s'arrête et les sauvegardes sont à l'abri. Mais le laboratoire et l'imagerie sont à l'arrêt : les résultats de biologie partent par coursier, et tout passe au papier.",
      avis:["CERT Santé","C'est la mesure la plus sûre pour le système : isoler d'abord, comprendre ensuite, en gardant les machines allumées pour l'enquête. Le prix se paie tout de suite, du côté des soins."] },
    { l:"Isoler les serveurs touchés et couper le VPN du prestataire", det:"Le reste de l'hôpital continue de tourner.",
      fx:()=>({e:{soins:-1, si:-1}, why:[]}),
      cq:"Le VPN est coupé à 7 h 10 et les serveurs touchés sont isolés. Le laboratoire tourne encore. Mais à 8 h 50, le serveur d'imagerie est chiffré à son tour : l'attaquant avait un autre point d'appui.",
      avis:["CERT Santé","Une réponse proportionnée, à condition de savoir où est l'attaquant. Ici, c'était un pari."] },
    { l:"Éteindre immédiatement tous les serveurs et les postes", det:"Le chiffrement s'arrête net ; on rallumera après.",
      fx:()=>({e:{soins:-2, equipes:-1, si:+1}, why:[]}),
      cq:"À 7 h, tout est éteint et le chiffrement s'arrête. Mais en éteignant, on a effacé les traces en mémoire qui auraient montré par où l'attaquant est entré. Le laboratoire et l'imagerie sont à l'arrêt.",
      avis:["CERT Santé","Éteindre arrête le chiffrement, mais efface les traces dont l'enquête a besoin. La recommandation est de déconnecter du réseau sans éteindre."] }
   ]},
 { t:"Les urgences", when:"Samedi, 10 h",
   sit:() => ["L'ARS vous appelle : elle doit savoir avant 11 h si vos urgences restent ouvertes, et organiser avec le SAMU l'orientation des ambulances. Aucun retour du système n'est envisageable avant 48 heures.",
              "Samedi est un jour chargé : les urgences reçoivent en moyenne une ambulance toutes les vingt minutes."],
   variants:(c) => [ c[0]==="A" ? "Sans laboratoire informatisé, chaque résultat de biologie met 40 minutes à arriver."
                   : c[0]==="B" ? "L'imagerie est tombée à 8 h 50 ; le laboratoire tient."
                   : "Tout est éteint : chaque résultat de biologie met 40 minutes à arriver, par coursier." ],
   roles:[
    {s:"Le CHU voisin est déjà à 120 % de ses capacités aux urgences. L'ARS attend votre réponse avant 11 h.", d:"Une décision qui tienne 48 heures, pas seulement la matinée."},
    {s:"Aucune date de retour du système avant 48 heures : vous ne pouvez rien promettre aux soins.", d:"Ne pas faire reposer les urgences sur un système dont vous ne garantissez rien."},
    {s:"Six patients sont en réanimation, deux en dialyse. Sans historique, chaque prescription se fait sans connaître les traitements en cours.", d:"La sécurité des patients déjà présents passe avant l'accueil de nouveaux."},
    {s:"Le rappel des agents en repos est possible, mais un tiers est en congés. Les syndicats préviennent qu'ils suivront les heures de près.", d:"Ne pas épuiser les équipes dès le premier jour d'une crise qui va durer."}],
   hint:"Un mode dégradé tient d'autant mieux que la procédure papier a été exercée. Ce n'était pas le cas ici.",
   opts:[
    { l:"Déclencher le plan blanc et délester", det:"Le SAMU oriente les ambulances vers le CHU.",
      fx:(c)=>({e:{secu:c[0]!=="B"?+2:+1, soins:-1, equipes:+1, confiance:-1},
                why:c[0]!=="B"?["Parce que le laboratoire est arrêté, envoyer les cas graves ailleurs protège encore davantage vos patients."]:[]}),
      cq:"Le plan blanc est déclenché à 10 h 40. Les ambulances partent vers le CHU ; vos urgences ne gardent que les patients qui se présentent d'eux-mêmes. Le maire appelle : la population s'inquiète de voir ses urgences « fermées ».",
      avis:["CHU voisin","Nous prenons vos patients, mais nous ne tiendrons pas au-delà de 48 heures."] },
    { l:"Maintenir les urgences ouvertes en mode dégradé papier", det:"Le personnel en repos est rappelé.",
      fx:(c)=>({e:{soins:+1, secu:c[0]!=="B"?-2:-1, equipes:-2},
                why:c[0]!=="B"?["Sans laboratoire, garder les urgences ouvertes expose encore davantage vos patients."]:[]}),
      cq:"Les urgences restent ouvertes. Vingt agents en repos sont rappelés ; la procédure papier, jamais exercée, se rode dans la douleur.",
      avis:["Chef de service des urgences","On tient, mais chaque prescription sans historique est un risque."] },
    { l:"Rester ouvert en déprogrammant pour redéployer", det:"La chirurgie programmée et les consultations sont suspendues ; leurs soignants renforcent les urgences.",
      fx:(c)=>({e:{soins:-1, secu:c[0]!=="B"?-2:-1},
                why:c[0]!=="B"?["Sans laboratoire, garder les urgences ouvertes expose encore davantage vos patients."]:[]}),
      cq:"Les opérations de lundi et mardi sont reportées, les consultations annulées. Les infirmières de bloc et de consultation renforcent les urgences : personne n'a été rappelé de repos.",
      avis:["Chef de service de chirurgie","Mes patients attendaient leur opération depuis des mois. On les soigne quand, eux ?"] }
   ]},
 { t:"Parler ou se taire", when:"Samedi, 12 h 30",
   sit:() => ["Une journaliste de France 3 Occitanie vous appelle : des soignants évoquent une cyberattaque sur les réseaux sociaux, et elle a les photos des écrans. Elle publie dans 30 minutes, avec ou sans votre réponse.",
              "À cette heure, l'ARS n'a été prévenue que par téléphone : aucune déclaration écrite n'a été faite."],
   variants:(c) => c[1]==="A" ? ["Elle sait déjà que les ambulances sont détournées vers le CHU."] : [],
   roles:[
    {s:"La déclaration d'incident n'est pas faite ; l'ARS a seulement été prévenue par téléphone.", d:"Ne rien dire publiquement qui vous engage avant d'en savoir plus."},
    {s:"Le vol de données n'est ni confirmé ni exclu. Le CERT Santé peut vous appuyer dès que l'incident est déclaré.", d:"Déclarer tout de suite : sans déclaration, pas d'appui."},
    {s:"Les familles appellent le standard ; les soignants sont interpellés dans les couloirs.", d:"Rassurer patients et familles sur la continuité des soins."},
    {s:"Les rumeurs parlent de « dossiers volés ». La journaliste a les photos.", d:"Donner votre version avant que d'autres ne la donnent à votre place."}],
   hint:"La déclaration à l'ARS et au CERT Santé est une obligation ; le contenu du communiqué, lui, est un choix. Ne confondez pas les deux.",
   opts:[
    { l:"Déclarer l'incident, porter plainte, puis publier un communiqué", det:"Portail des signalements, ARS, CERT Santé. Communiqué : « cyberattaque en cours, prise en charge des patients assurée, investigation en cours ».",
      fx:(c)=>({e:{conformite:+2, confiance:c[1]==="A"?+1:+2, si:+1, equipes:-1},
                why:c[1]==="A"?["Avec des ambulances détournées, « prise en charge assurée » sonne faux : la confiance progresse moins."]:[]}),
      cq:"L'incident est déclaré à 12 h 50, la plainte déposée à 15 h. L'article reprend votre communiqué. Le CERT Santé vous rappelle dans l'heure.",
      avis:["ARS","Merci. Une cellule régionale est activée, avec un point de situation toutes les 4 heures."] },
    { l:"Déclarer et porter plainte, mais ne rien dire à la presse", det:"Comme le conseille l'assureur : attendre que le CERT Santé ait qualifié l'attaque. Consigne au personnel : ne rien publier.",
      fx:(c)=>({e:{conformite:+2, si:+1, confiance:c[1]==="A"?-2:-1},
                why:c[1]==="A"?["Les ambulances détournées se voient de la rue : l'article est plus dur avec vous."]:[]}),
      cq:"L'incident est déclaré et le CERT Santé vous appuie. L'article sort à 13 h, sans votre version.",
      avis:["Journaliste","Nous avons publié avec ce que nous avions. L'hôpital n'a pas souhaité s'exprimer."] },
    { l:"Rassurer la presse, et déclarer par écrit lundi avec un diagnostic complet", det:"L'ARS a été prévenue par téléphone. À la journaliste : « incident informatique en cours d'analyse, aucune donnée de patient compromise à ce stade ».",
      fx:()=>({e:{conformite:-3, confiance:+1}, why:[]}),
      cq:"L'article reprend votre phrase : « aucune donnée de patient compromise ». Pour l'instant, cela rassure. La déclaration écrite attendra lundi.",
      avis:["CERT Santé","Un incident grave se déclare sans délai, par écrit. Et « aucune donnée compromise », personne ne pouvait encore l'affirmer."] }
   ]},
 { t:"Quoi restaurer d'abord", when:"Dimanche, 9 h",
   sit:() => ["Le CERT Santé et l'équipe informatique ont trouvé une partie des sauvegardes intacte. Mais l'équipe ne peut restaurer qu'un système à la fois, et chacun prend environ 48 heures.",
              "Il faut choisir ce qui reviendra en premier : le reste attendra au moins jusqu'à mardi."],
   variants:(c) => [ ...(c[0]==="C" ? ["Faute de traces, personne ne sait par où l'attaquant est entré : chaque serveur doit être vérifié avant d'être restauré."] : []),
                     ...(c[1]==="A" ? ["Le CHU demande que vous repreniez vos patients lundi."] : []) ],
   roles:[
    {s:"La paie part mardi, et le planning des gardes est dans le même système.", d:"Tenir le personnel, sans qui aucune crise ne se traverse."},
    {s:"Le laboratoire et la pharmacie sont les plus rapides à remettre en service ; le dossier patient est le plus long.", d:"Restaurer d'abord ce qui sera prêt le plus vite."},
    {s:"Les transmissions papier s'accumulent. Cette nuit, une erreur de dose a été évitée de justesse.", d:"Le dossier patient avant tout."},

const clamp = v => Math.max(0, Math.min(10, v));
function applyTour(g, choices, i){
  const o = TOURS[i].opts["ABC".indexOf(choices[i])];
  const r = o.fx(choices); const before = {...g};
  for(const [k,d] of Object.entries(r.e)) g[k] = clamp(g[k] + d);
  return {before, after:{...g}, e:r.e, why:r.why};
}
function simulate(choices){
  const g = {...START}; const steps = [];
  for(let i=0;i<choices.length;i++) steps.push(applyTour(g, choices, i));
  return {g, steps};
}
function ending(g){
  // la fin est donnée par la jauge la plus basse parmi celles à 3 ou moins (à égalité, l'ordre de ENDINGS)
  let best = null;
  for(const e of ENDINGS) if(g[e.k] <= 3 && (best === null || g[e.k] < g[best.k])) best = e;
  return best || TENU;
}
function otherAlerts(g){
  const e = ending(g);
  return GAUGES.filter(x => g[x.k] <= 3 && x.k !== e.k).map(x => x.n);
}
const gName = k => GAUGES.find(x=>x.k===k).n;

const $ = (sel, root=document) => root.querySelector(sel);
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="class") el.className = v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if(v===true) el.setAttribute(k,"");
    else if(v!==false && v!=null) el.setAttribute(k, v);
  }
  for(const k of kids.flat(Infinity)){ if(k==null||k===false) continue; el.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return el;
}

const CODE_ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ";
function tourCode(g, t){ // code de 4 lettres, propre à chaque groupe et à chaque tour
  let x = ((g*7919 + (t+1)*104729 + 1301) * 2654435761) >>> 0, out = "";
  for(let k=0;k<4;k++){ out += CODE_ALPHA[x % CODE_ALPHA.length]; x = Math.floor(x / CODE_ALPHA.length) ^ (x*31 >>> 0); x >>>= 0; }
  return out;
}

/* ---------------- un tour ---------------- */
function renderTour(){
  const i = S.tour, T = TOURS[i];
  if(!S.openedAt) S.openedAt = Date.now();
  const elapsed = h("span",{class:"chrono"});
  app.append(topBar(h("div",{}, h("span",{class:"clock"}, T.when), " ", elapsed)));

  let pick = S.pending || null;
  const optButtons = T.opts.map((o,k)=>{
    const L = "ABC"[k];
    return h("button",{class:"opt","aria-pressed":String(pick===L), onclick:()=>{ pick=L; S.pending=L; save(); optButtons.forEach((b,j)=>b.setAttribute("aria-pressed", String("ABC"[j]===L))); }},
      h("span",{class:"letter"}, L), h("span",{}, h("span",{class:"lbl"}, o.l), h("br"), h("span",{class:"det"}, o.det)));
  });
  const just = h("textarea",{id:"just",placeholder:"Notre décision repose sur… (carte du rôle…)"}, S.pendingJust||"");
  just.addEventListener("input",()=>{ S.pendingJust = just.value; save(); });
  const err = h("p",{class:"err",role:"alert"});
  const validate = h("button",{class:"btn",onclick:()=>{
      if(Math.floor((Date.now()-S.openedAt)/1000) < minSec()){ err.textContent = "Prenez encore le temps d'en discuter : la validation s'ouvre après 5 minutes."; return; }
      if(!pick){ err.textContent = "Choisissez une option."; return; }
      if(!TEST() && (just.value||"").trim().length < 15){ err.textContent = `Indiquez l'information qui fonde votre décision, et sa carte (15 caractères minimum, ${(just.value||"").trim().length} pour l'instant).`; return; }
      if(!confirm(`Valider l'option ${pick} ? La décision est définitive.`)) return;
      S.choices += pick; S.just[i] = just.value.trim(); S.pending = null; S.pendingJust = ""; S.screen = "result"; save(); render();
    }},"Valider la décision");
  const tick = () => {
    const s = Math.floor((Date.now() - S.openedAt)/1000);
    elapsed.textContent = `Tour ${i+1} sur 6 : ${mmss(s)}`;
    elapsed.classList.toggle("late", s >= SOFT_SEC);
    const left = minSec() - s;
    validate.disabled = left > 0;
    validate.textContent = left > 0 ? `Validation possible dans ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}` : "Valider la décision";
  };
  tick(); ticker = setInterval(tick, 1000);

  const roleCards = ROLES.map((r,k)=>{
    const secret = h("div",{class:"secret hidden"},

      h("b",{}, r + (S.names[k] ? ` (${S.names[k]})` : "")),
      h("span",{class:"hint"},"Réservé à ce rôle : ouvrez, puis lisez à voix haute."), secret);
    return b;
  });

  const hintBox = h("div",{class:"notice" + (S.hintsSeen.includes(i) ? "" : " hidden"), role:"status"}, h("b",{},"CERT Santé : "), "« " + T.hint + " »");
  const expBox = h("div",{class:"notice hidden", role:"status"},"Levez la main : votre enseignant arrive.");
  const certBtn = h("button",{class:"btn ghost small", disabled: S.jokCert<=0 || S.hintsSeen.includes(i), onclick:()=>{
      if(S.jokCert<=0) return; S.jokCert--; S.hintsSeen.push(i); save(); hintBox.classList.remove("hidden"); certBtn.disabled = true; certBtn.textContent = `Appeler le CERT Santé (${S.jokCert} restant${S.jokCert>1?"s":""})`; }},
    `Appeler le CERT Santé (${S.jokCert} restant${S.jokCert>1?"s":""})`);
  const expBtn = h("button",{class:"btn ghost small", disabled: S.jokExp<=0, onclick:()=>{
      if(S.jokExp<=0) return; S.jokExp--; S.expertCalls.push(i); save(); expBox.classList.remove("hidden"); expBtn.disabled = S.jokExp<=0; expBtn.textContent = `Appeler l'expert (${S.jokExp} restant${S.jokExp>1?"s":""})`; }},
    `Appeler l'expert (${S.jokExp} restant${S.jokExp>1?"s":""})`);

  const past = S.choices.split("").map((L,k)=>{ const o = TOURS[k].opts["ABC".indexOf(L)];
    return h("li",{}, h("b",{}, `Tour ${k+1} – ${TOURS[k].t} : ${L}. `), o.l, S.just[k] ? h("div",{class:"meta"}, "Justification : " + S.just[k]) : ""); });
  const main = h("div",{},
    past.length ? h("details",{class:"sheet noprint"}, h("summary",{}, h("b",{},"Vos décisions précédentes")), h("ul",{}, past)) : "",
    h("div",{class:"sheet situation"},
      h("p",{class:"when"}, `Tour ${i+1} – ${T.when}`),
      h("h1",{}, T.t),
      T.sit(S.choices).map(p=>h("p",{}, p)),
      T.variants(S.choices).map(v=>h("p",{class:"variant"}, v))),
    h("div",{class:"sheet"},
      h("h2",{style:"margin-top:0"},"Ce que sait chaque rôle"),
      (S.size===3 ? h("p",{class:"notice"},`Dans votre groupe, ${S.names[1] ? S.names[1] : "la même personne"} lit les deux cartes Informatique et Communication.`) : ""),
      h("p",{class:"meta"}, (S.cards==="phones" ? "Chaque membre lit ses messages sur son téléphone, puis résume au groupe ce qui compte vraiment. " : "Chaque rôle ouvre sa carte, lit ses messages, puis résume au groupe ce qui compte vraiment. ") + "Ce que vous défendez est votre position de départ : vous pouvez changer d'avis, à condition de le dire."),
      S.cards==="phones"
        ? h("div",{},
            h("p",{class:"notice"}, "Code du tour à saisir sur les téléphones : ", h("span",{class:"code"}, tourCode(S.group, i))),
            h("details",{}, h("summary",{class:"meta"},"Un téléphone ne fonctionne pas ? Afficher les cartes ici"), h("div",{class:"roles",style:"margin-top:8px"}, roleCards)))
        : h("div",{class:"roles"}, roleCards)),
    h("div",{class:"sheet"},
      h("h2",{style:"margin-top:0"},"Votre décision"),
      h("div",{class:"options"}, optButtons),
      (S.size===5 ? h("p",{class:"meta"},`Secrétaire de crise${S.sec ? " (" + S.sec + ")" : ""} : rédigez la justification sous la dictée du groupe, et annoncez le temps à 5 et à 10 minutes.`) : ""),
      h("label",{class:"field",for:"just"},"Sur quelle information votre décision repose-t-elle, et de quelle carte vient-elle ?"), just, err,
      h("div",{class:"row",style:"justify-content:space-between;margin-top:12px"},
        h("div",{class:"jokers noprint"}, certBtn, expBtn), validate),

  app.append(h("div",{class:"grid"}, main, trendPanel(S.choices, false)));
  app.append(footer());
}

/* ---------------- attente du code du bilan ---------------- */
function renderWait(){
  app.append(topBar());
  const inp = h("input",{type:"text",id:"code",autocomplete:"off",autocapitalize:"characters",spellcheck:"false"});
  const err = h("p",{class:"err",role:"alert"});
  const go = () => {
    const v = inp.value.trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(v !== CODE_BILAN){ err.textContent = "Ce code ne correspond pas. Attendez l'annonce de votre enseignant."; return; }
    S.screen = "end"; save(); render();
  };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  const main = h("div",{class:"sheet"},
    h("h1",{},"En attente du bilan"),
    h("p",{},"Votre crise est terminée. Quand tous les groupes auront fini, l'enseignant annoncera le code du bilan : vous découvrirez alors l'état exact de l'hôpital et la façon dont votre crise se termine."),
    h("p",{class:"meta"},"En attendant, relisez ensemble vos justifications des six tours : chacun doit pouvoir les défendre."),

    h("div",{class:"row",style:"margin-top:12px"},
      h("button",{class:"btn",onclick:go},"Ouvrir le bilan"),

  app.append(h("div",{class:"grid"}, main, trendPanel(S.choices, false)));
  app.append(footer());
  setTimeout(()=>inp.focus(), 50);
}

/* ---------------- bilan ---------------- */
function trajCode(){ return `G${S.group}-${S.choices}`; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ficheHTML(){
  const sim = simulate(S.choices), e = ending(sim.g);
  const rows = S.choices.split("").map((L,i)=>{ const o = TOURS[i].opts["ABC".indexOf(L)]; const st = sim.steps[i];
    return `<tr><td>${i+1}. ${esc(TOURS[i].t)}</td><td><b>${L}</b> – ${esc(o.l)}</td><td>${esc(S.just[i]||"")}</td><td>${Object.entries(st.e).filter(([k,d])=>d).map(([k,d])=>esc(gName(k))+" "+fmt(d)).join(", ")}</td></tr>`; }).join("");
  const gs = GAUGES.map(x=>`<li>${x.n} : <b>${sim.g[x.k]}/10</b></li>`).join("");
  const rf = REFLECT.map((q,k)=>`<p><b>${esc(q)}</b><br>${esc(S.reflect[k]||"")}</p>`).join("");
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Trajectoire ${trajCode()}</title><style>body{font-family:system-ui,Arial,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#16233A}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ccd;padding:6px;text-align:left;vertical-align:top}</style></head><body>
<h1>Cellule de crise – CH de Montclair</h1><p>Groupe ${S.group}${S.gname?" : "+esc(S.gname):""}. Taille du groupe : ${S.size||4}. Rôles : ${ROLES.map((r,i)=>esc(r)+(S.names[i]?" ("+esc(S.names[i])+")":"")).join(" ; ")}.</p>
<h2>Fin : ${esc(e.t)}</h2><p>${esc(e.d)}</p>${otherAlerts(sim.g).length ? "<p><b>Autres jauges en alerte :</b> " + esc(otherAlerts(sim.g).join(", ")) + ".</p>" : ""}<h2>Code de trajectoire : ${trajCode()}</h2>
<h2>Décisions</h2><table><tr><th>Tour</th><th>Choix</th><th>Justification</th><th>Effets</th></tr>${rows}</table>
<h2>État final</h2><ul>${gs}</ul><h2>Restitution</h2>${rf}</body></html>`;
}
async function downloadFiche(msg){
  const html = ficheHTML(), name = `trajectoire-groupe-${S.group}.html`;
  try{
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if(dl){ await dl.save({filename:name, data:html}); msg.textContent = "Fiche enregistrée."; return; }
  }catch(e){ if(e && e.code==="declined"){ msg.textContent = "Enregistrement annulé."; return; } }
  try{
    const url = URL.createObjectURL(new Blob([html],{type:"text/html"}));
    const a = h("a",{href:url, download:name}); document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000); msg.textContent = "Fiche téléchargée.";
  }catch(e){ msg.textContent = "Le téléchargement n'est pas disponible ici : recopiez votre code de trajectoire."; }
}

   ============================================================ */
const A = (()=>{ try{ return JSON.parse(localStorage.getItem(KEY+"-anim")) || {}; }catch(e){ return {}; } })();
function saveA(){ try{ localStorage.setItem(KEY+"-anim", JSON.stringify(A)); }catch(e){} }
function renderAnim(){
  A.dur = A.dur || 75*60; A.left = A.left ?? A.dur; A.run = A.run || false; A.codes = A.codes || ""; A.showCode = !!A.showCode;
  app.append(h("header",{class:"top"},
    h("div",{class:"brand"},"Écran animateur", h("small",{},"Exercice de crise cyber – CH de Montclair")),
    h("a",{href:"#",class:"meta",onclick:(e)=>{e.preventDefault(); history.replaceState(null,"",location.pathname+location.search); render();}},"Revenir à l'écran des groupes")));

  const big = h("div",{class:"big"});
  const paint = ()=>{ const s=Math.max(0,A.left); big.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; big.classList.toggle("late", A.left<=10*60); };
  paint();
  if(A.run){ A.endAt = A.endAt || (Date.now() + A.left*1000); ticker = setInterval(()=>{ A.left = Math.max(0, Math.round((A.endAt-Date.now())/1000)); paint(); if(A.left<=0){ A.run=false; clearInterval(ticker); } saveA(); }, 500); }
  const durIn = h("input",{type:"number",min:"10",max:"180",value:String(Math.round(A.dur/60)),style:"width:90px"});
  app.append(h("section",{class:"sheet"},
    h("h2",{style:"margin-top:0"},"Temps de jeu restant"), big,
    h("p",{class:"meta",style:"text-align:center"},"Pour tester le jeu sans attendre 5 minutes par tour\u00a0: ", h("a",{href:"#test"},"ouvrir le mode test"), "."),
    h("div",{class:"row",style:"justify-content:center;margin:10px 0"},
      h("button",{class:"btn",onclick:()=>{ if(A.run){ A.run=false; A.endAt=null; } else { A.run=true; A.endAt=Date.now()+A.left*1000; } saveA(); render(); }}, A.run?"Mettre en pause":"Démarrer"),
      h("button",{class:"btn ghost",onclick:()=>{ A.dur = Math.max(10,parseInt(durIn.value,10)||75)*60; A.left=A.dur; A.run=false; A.endAt=null; saveA(); render(); }},"Remettre à zéro"),
      h("label",{class:"meta"}," Durée (min) ", durIn)),
    h("p",{class:"meta",style:"text-align:center"},"Les groupes avancent à leur rythme : environ 10 à 12 minutes par tour, 5 minutes au minimum. Rappelez l'heure à mi-parcours."),
    h("div",{class:"notice"}, "Code du bilan, à annoncer quand tous les groupes ont fini : ", A.showCode ? h("span",{class:"code"}, CODE_BILAN) : h("span",{class:"meta"},"masqué")),
    h("button",{class:"btn ghost small",onclick:()=>{ A.showCode=!A.showCode; saveA(); render(); }}, A.showCode?"Masquer le code":"Afficher le code")));

  const ta = h("textarea",{placeholder:"Un code par ligne, par exemple : G3-ABCABA"}, A.codes);
  const out = h("div",{});
  const compare = ()=>{
    A.codes = ta.value; saveA(); out.innerHTML = "";
    const rows = []; const bad = [];
    ta.value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean).forEach(s=>{
      const m = s.toUpperCase().match(/^G?\s*(\d+)\s*[-: ]?\s*([ABC]{1,6})$/);
      if(m) rows.push({grp:parseInt(m[1],10), c:m[2]}); else bad.push(s);
    });
    if(bad.length) out.append(h("p",{class:"err"}, "Codes non reconnus : " + bad.join(", ")));
    if(!rows.length){ out.append(h("p",{class:"meta"},"Saisissez les codes des groupes pour afficher la comparaison.")); return; }
    // un même groupe peut être saisi plusieurs fois au fil des tours : on garde son code le plus avancé
    const best = new Map(); rows.forEach(r=>{ const o = best.get(r.grp); if(!o || r.c.length >= o.c.length) best.set(r.grp, r); });
    const rows2 = [...best.values()].sort((a,b)=>a.grp-b.grp);
    const res = rows2.map(r=>({...r, ...simulate(r.c)}));
    out.append(h("h3",{},"Trajectoires"), h("div",{class:"scroll"}, h("table",{},
      h("tr",{}, h("th",{},"Groupe"), TOURS.map((t,i)=>h("th",{}, `T${i+1}`)), GAUGES.map(x=>h("th",{title:x.d}, x.n)), h("th",{},"Fin")),
      res.map(r=>h("tr",{}, h("td",{}, h("b",{},"G"+r.grp)), [0,1,2,3,4,5].map(i=>h("td",{}, r.c[i] || "…")), GAUGES.map(x=>r.c.length<6 ? h("td",{class:"meta"},"–") : h("td",{style:(r.g[x.k]<=3?"color:var(--alarm);font-weight:800":null)}, r.g[x.k])), h("td",{}, r.c.length===6 ? ending(r.g).t : `Tour ${r.c.length+1} en cours`))))));
    out.append(h("h3",{},"Répartition des choix, tour par tour"));
    TOURS.forEach((t,i)=>{
      const reached = res.filter(r=>r.c.length>i).length;
      out.append(h("h3",{style:"font-size:1rem"}, `Tour ${i+1} : ${t.t} (${reached} groupe${reached>1?"s":""} sur ${res.length} ont décidé)`),
        h("div",{class:"dist"}, t.opts.map((o,k)=>{ const L="ABC"[k]; const who = res.filter(r=>r.c[i]===L).map(r=>"G"+r.grp);
          return h("div",{}, h("b",{}, `${L} – ${who.length} groupe${who.length>1?"s":""}`), h("br"), h("span",{class:"meta"}, o.l), h("br"), who.join(", ")); })));
    });
  };
  app.append(h("section",{class:"sheet"},
    h("h2",{style:"margin-top:0"},"Comparer les trajectoires"),
    h("p",{class:"meta"},"Collez les codes reçus des groupes, à tout moment : codes d'avancement en cours de jeu (par exemple G3-AB) ou codes de trajectoire complets. Collez tout, même en double : le code le plus avancé de chaque groupe est retenu. Les jauges sont recalculées à partir des choix."),
    ta, h("div",{class:"row",style:"margin:10px 0"}, h("button",{class:"btn",onclick:compare},"Afficher la comparaison")), out));
  if(A.codes) compare();

  app.append(h("section",{class:"sheet"},
    h("h2",{style:"margin-top:0"},"Référence du scénario, pour le débriefing"),
    h("p",{class:"meta"},"Effets de base, hors effets des choix précédents."),
    TOURS.map((t,i)=>h("div",{}, h("h3",{}, `Tour ${i+1} – ${t.when} : ${t.t}`),
      h("div",{class:"scroll"}, h("table",{},
        h("tr",{}, h("th",{},"Option"), h("th",{},"Effets de base"), h("th",{},"Selon les choix précédents"), h("th",{},"Ce qui se passe")),
        t.opts.map((o,k)=>{ const base = o.fx("BCABAA").e;
          const vars = new Map();
          for(const a of "ABC") for(const b of "ABC") for(const c of "ABC") for(const d of "ABC") for(const f of "ABC"){
            const r = o.fx(a+b+c+d+f+"A"); r.why.forEach(w => vars.set(w, Object.entries(r.e).filter(([kk,dd])=>dd).map(([kk,dd])=>`${gName(kk)} ${fmt(dd)}`).join(", "))); }
          return h("tr",{}, h("td",{}, h("b",{},"ABC"[k]+" "), o.l), h("td",{}, Object.entries(base).filter(([kk,d])=>d).map(([kk,d])=>`${gName(kk)} ${fmt(d)}`).join(", ") || "Aucun"),
            h("td",{}, vars.size ? [...vars].map(([w,e])=>h("div",{class:"meta"}, w + " (" + e + ")")) : "Aucun changement"), h("td",{}, o.cq)); }))),
      h("p",{class:"meta"}, "Indice du CERT Santé : " + t.hint),
      h("details",{}, h("summary",{class:"meta"},"Ce que les cartes doivent faire émerger"),
        h("ul",{},
          h("li",{}, h("b",{},"Informations décisives : "), t.keys.cles.join(" ")),
          h("li",{}, h("b",{},"Contradiction entre deux cartes : "), t.keys.contra),
          h("li",{}, h("b",{},"Informations à combiner : "), t.keys.comb),
          h("li",{}, h("b",{},"Faux amis : "), t.keys.faux)))))));
}

render();

</script>
</body>
</html>
